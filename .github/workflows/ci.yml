name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — the engine and its tests are dependency-free.
      - name: Syntax check
        run: |
          node --check src/pathwayEngine.js
          node --check src/app.js
          node --check data/sampleEvents.js
          node --check scripts/serve.mjs

      - name: Run tests
        run: npm test

  lint-python:
    name: Detector compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile the original detector
        run: python -m py_compile vision/hazard_detector.py
