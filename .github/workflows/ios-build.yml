name: iOS prototype checks
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Portable core tests
        run: swift test --package-path ios
      - name: Simulator compilation (no signing or model required)
        run: >-
          xcodebuild -project ios/Pathway.xcodeproj -scheme Pathway
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
